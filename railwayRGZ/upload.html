<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色贴图上传</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 0%, #1b2b45 0%, #0d1622 60%, #070c13 100%);
    color: #e8eef7;
    font: 15px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 680px;
    background: rgba(22, 33, 50, 0.92);
    border: 1px solid rgba(120, 170, 255, 0.22);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }
  h1 { margin: 0 0 4px; font-size: 21px; letter-spacing: .5px; }
  .sub { margin: 0 0 22px; color: #8ea6c4; font-size: 13px; }
  .label { font-size: 13px; color: #8ea6c4; margin: 0 0 8px; }

  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .type {
    position: relative; cursor: pointer; text-align: center;
    padding: 16px 12px; border-radius: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 2px solid rgba(120, 170, 255, 0.18);
    transition: border-color .16s, background .16s, transform .16s;
    user-select: none;
  }
  .type:hover { background: rgba(255, 255, 255, 0.07); transform: translateY(-1px); }
  .type.on {
    border-color: #ffc400;
    background: rgba(255, 196, 0, 0.12);
    box-shadow: 0 0 0 4px rgba(255, 196, 0, 0.08);
  }
  .type b { display: block; font-size: 17px; margin-bottom: 3px; }
  .type span { font-size: 12px; color: #8ea6c4; font-family: ui-monospace, Menlo, monospace; }

  .drop {
    border: 2px dashed rgba(120, 170, 255, 0.3);
    border-radius: 14px;
    padding: 30px 18px;
    text-align: center;
    cursor: pointer;
    transition: border-color .16s, background .16s;
    background: rgba(255, 255, 255, 0.02);
  }
  .drop:hover, .drop.hot { border-color: #5cb4ff; background: rgba(92, 180, 255, 0.09); }
  .drop .big { font-size: 30px; margin-bottom: 6px; }
  .drop .hint { color: #8ea6c4; font-size: 13px; }

  .preview { display: none; margin-top: 18px; align-items: center; gap: 16px; }
  .preview.show { display: flex; }
  .preview img {
    width: 108px; height: 108px; object-fit: contain;
    border-radius: 12px; background: #0b131f;
    border: 1px solid rgba(120, 170, 255, 0.22);
  }
  .preview .meta { font-size: 13px; color: #a9bfda; }
  .preview .meta b { color: #e8eef7; }

  .msg { margin-top: 18px; padding: 13px 15px; border-radius: 12px; font-size: 14px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: rgba(31, 184, 92, 0.16); border: 1px solid rgba(31, 184, 92, 0.5); color: #86efac; }
  .msg.err { background: rgba(255, 59, 47, 0.14); border: 1px solid rgba(255, 59, 47, 0.5); color: #ffb4ae; }
  .msg.busy { background: rgba(92, 180, 255, 0.14); border: 1px solid rgba(92, 180, 255, 0.45); color: #a5d4ff; }
  .msg code { background: rgba(0, 0, 0, .35); padding: 1px 6px; border-radius: 5px; }

  .foot { margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(120, 170, 255, 0.14);
          display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  a { color: #7cc4ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .note { color: #7d93ae; font-size: 12px; line-height: 1.7; margin-top: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>角色贴图上传</h1>
  <p class="sub">选角色 → 选图片 → 直接落盘，不用打包、不用重启。</p>

  <p class="label">1. 这是谁的贴图？</p>
  <div class="types">
    <div class="type on" data-type="xiongda">
      <b>熊大</b><span>assets/xiongda.png</span>
    </div>
    <div class="type" data-type="nailong">
      <b>奶龙</b><span>assets/nailong.png</span>
    </div>
  </div>

  <p class="label">2. 选图片（也可以直接拖进来）</p>
  <div class="drop" id="drop">
    <div class="big">🖼</div>
    <div>点击选择图片</div>
    <div class="hint">png / jpg / webp / gif，单张 12MB 以内</div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>

  <div class="preview" id="preview">
    <img id="thumb" alt="预览">
    <div class="meta" id="meta"></div>
  </div>

  <div class="msg" id="msg"></div>

  <p class="note">
    图片会原样写入 <code>assets/</code>，文件名固定为上面的路径（内容格式不限，浏览器按内容解码）。<br>
    贴图会同时套到<b>身体</b>和<b>头</b>两个部件上，建议用正方形、主体居中的图。
  </p>

  <div class="foot">
    <span style="color:#7d93ae">开发小服务 · 仅本机可访问</span>
    <a href="/index.html" target="_blank">打开游戏 ↗</a>
  </div>
</div>

<script>
(function () {
  const drop = document.getElementById('drop');
  const input = document.getElementById('file');
  const preview = document.getElementById('preview');
  const thumb = document.getElementById('thumb');
  const meta = document.getElementById('meta');
  const msg = document.getElementById('msg');
  const typeCards = Array.prototype.slice.call(document.querySelectorAll('.type'));

  let type = 'xiongda';
  let busy = false;

  typeCards.forEach(function (el) {
    el.addEventListener('click', function () {
      typeCards.forEach(function (o) { o.classList.remove('on'); });
      el.classList.add('on');
      type = el.dataset.type;
    });
  });

  function say(kind, html) {
    msg.className = 'msg show ' + kind;
    msg.innerHTML = html;
  }

  function human(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  }

  /* 选中文件后立刻上传，一步到位 */
  function handleFile(file) {
    if (!file) return;

    const url = URL.createObjectURL(file);
    thumb.src = url;
    thumb.onload = function () { URL.revokeObjectURL(url); };
    meta.innerHTML = '<b>' + file.name + '</b><br>原始大小 ' + human(file.size);
    preview.classList.add('show');

    if (busy) return;
    busy = true;
    say('busy', '上传中…');

    fetch('/api/upload?type=' + encodeURIComponent(type), {
      method: 'POST',
      headers: { 'Content-Type': file.type || 'application/octet-stream' },
      body: file
    })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: '服务返回了非 JSON（是不是服务没起？）' }; }); })
      .then(function (j) {
        if (j.ok) {
          say('ok', '✅ 已写入 <code>' + j.file + '</code>（' + j.format + '，' + human(j.bytes) + '）<br>' +
                    '回到游戏页面刷新一下就能看到新造型。');
        } else {
          say('err', '❌ ' + j.error);
        }
      })
      .catch(function (e) {
        say('err', '❌ 上传失败：' + e.message);
      })
      .then(function () {
        busy = false;
        input.value = '';   // 允许重复选同一张
      });
  }

  drop.addEventListener('click', function () { input.click(); });

  input.addEventListener('change', function () {
    handleFile(input.files && input.files[0]);
  });

  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) {
      e.preventDefault();
      drop.classList.add('hot');
    });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) {
      e.preventDefault();
      drop.classList.remove('hot');
    });
  });
  drop.addEventListener('drop', function (e) {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(f);
  });
})();
</script>
</body>
</html>
